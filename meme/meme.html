<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA 6 x make.fun meme</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg,
      #1c0640 0%, #4a1168 26%, #a02068 48%,
      #e83e6b 62%, #ff7a3d 78%, #ffb347 100%);
    position: relative;
  }
  /* setting sun */
  .sun {
    position: absolute; left: 50%; top: 470px;
    width: 460px; height: 460px; margin-left: -230px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff8d6 0%, #ffd97a 45%, #ff9a4d 75%, rgba(255,154,77,0) 100%);
    opacity: 0.95;
  }
  /* skyline silhouette */
  .skyline { position: absolute; left: 0; bottom: 0; width: 1080px; height: 330px; }
  /* palms */
  .palm { position: absolute; bottom: 0; width: 380px; height: 460px; }
  .palm.left { left: -30px; }
  .palm.right { right: -30px; transform: scaleX(-1); }
  /* launch-week tag */
  .tag {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
    font-family: Arial, Helvetica, sans-serif; font-weight: 800;
    font-size: 34px; letter-spacing: 7px; color: #ffffff;
    border: 4px solid #ffffff; border-radius: 999px;
    padding: 12px 34px 12px 40px; background: rgba(28, 6, 64, 0.45);
    white-space: nowrap;
  }
  /* headline */
  .headline {
    position: absolute; top: 148px; left: 0; width: 1080px;
    text-align: center; color: #ffffff;
    font-size: 64px; line-height: 1.15; font-weight: 900;
    letter-spacing: 0; text-transform: uppercase; white-space: nowrap;
    text-shadow:
      0 4px 0 #1c0640, 4px 0 0 #1c0640, -4px 0 0 #1c0640, 0 -4px 0 #1c0640,
      4px 4px 0 #1c0640, -4px 4px 0 #1c0640, 4px -4px 0 #1c0640, -4px -4px 0 #1c0640,
      0 10px 22px rgba(0, 0, 0, 0.55);
  }
  .headline .line2 { color: #ffe45e; }
  /* the ghost, large and central */
  .ghost {
    position: absolute; left: 50%; top: 372px;
    width: 500px; height: 500px; margin-left: -250px;
    filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.55));
  }
  /* make.fun wordmark at the bottom */
  .brand {
    position: absolute; bottom: 44px; left: 0; width: 1080px;
    text-align: center; color: #ffffff;
    font-size: 76px; font-weight: 900; letter-spacing: 2px;
    text-shadow:
      0 3px 0 #1c0640, 3px 0 0 #1c0640, -3px 0 0 #1c0640, 0 -3px 0 #1c0640,
      3px 3px 0 #1c0640, -3px 3px 0 #1c0640, 3px -3px 0 #1c0640, -3px -3px 0 #1c0640,
      0 8px 18px rgba(0, 0, 0, 0.5);
  }
  .brand .dot { color: #ff2e88; }
</style>
</head>
<body>
  <div class="sun"></div>

  <!-- neon skyline -->
  <svg class="skyline" viewBox="0 0 1080 330" preserveAspectRatio="none">
    <rect x="0" y="330" width="1080" height="0" fill="#1c0640"/>
    <g fill="#1c0640">
      <rect x="0" y="210" width="90" height="120"/>
      <rect x="90" y="160" width="70" height="170"/>
      <rect x="160" y="230" width="110" height="100"/>
      <rect x="270" y="120" width="80" height="210"/>
      <rect x="350" y="190" width="100" height="140"/>
      <rect x="450" y="90" width="70" height="240"/>
      <rect x="520" y="170" width="110" height="160"/>
      <rect x="630" y="130" width="80" height="200"/>
      <rect x="710" y="200" width="100" height="130"/>
      <rect x="810" y="110" width="70" height="220"/>
      <rect x="880" y="180" width="100" height="150"/>
      <rect x="980" y="140" width="100" height="190"/>
    </g>
    <g fill="#ff2e88">
      <rect x="450" y="86" width="70" height="6"/>
      <rect x="270" y="116" width="80" height="6"/>
      <rect x="810" y="106" width="70" height="6"/>
    </g>
    <rect x="482" y="40" width="6" height="50" fill="#1c0640"/>
    <circle cx="485" cy="36" r="8" fill="#ff2e88"/>
  </svg>

  <!-- palm silhouettes -->
  <svg class="palm left" viewBox="0 0 380 460">
    <g fill="#16032e">
      <path d="M150 460 L175 460 L185 300 L160 300 Z"/>
      <path d="M170 300 Q120 210 30 190 Q110 240 160 290 Z"/>
      <path d="M178 295 Q200 190 300 160 Q220 230 188 288 Z"/>
      <path d="M172 292 Q150 190 60 150 Q120 230 162 285 Z"/>
      <path d="M184 290 Q230 200 330 200 Q250 250 192 285 Z"/>
      <path d="M168 296 Q90 260 20 300 Q90 300 160 305 Z"/>
      <path d="M186 294 Q260 250 350 280 Q270 290 192 302 Z"/>
    </g>
  </svg>
  <svg class="palm right" viewBox="0 0 380 460">
    <g fill="#16032e">
      <path d="M150 460 L175 460 L185 300 L160 300 Z"/>
      <path d="M170 300 Q120 210 30 190 Q110 240 160 290 Z"/>
      <path d="M178 295 Q200 190 300 160 Q220 230 188 288 Z"/>
      <path d="M172 292 Q150 190 60 150 Q120 230 162 285 Z"/>
      <path d="M184 290 Q230 200 330 200 Q250 250 192 285 Z"/>
      <path d="M168 296 Q90 260 20 300 Q90 300 160 305 Z"/>
      <path d="M186 294 Q260 250 350 280 Q270 290 192 302 Z"/>
    </g>
  </svg>

  <div class="tag">GTA 6 &bull; LAUNCH WEEK</div>

  <div class="headline">
    MY AGENT GRINDS BOUNTIES<br>
    <span class="line2">SO I CAN GRIND VICE CITY</span>
  </div>

  <img class="ghost" src="ghost.png" alt="make.fun ghost holding its magenta star coin">

  <div class="brand">make<span class="dot">.</span>fun</div>
</body>
</html>
